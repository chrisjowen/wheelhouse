name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Vitest's transformed modules (fsModuleCache), restored after npm ci clears node_modules.
      - uses: actions/cache@v4
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: vitest-${{ hashFiles('package-lock.json') }}-

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Package contents
        # prepack builds the app and the CLI, so this also checks the build.
        run: npm pack --dry-run

      - name: Install the package and start the CLI
        run: |
          tmp="$(mktemp -d)"
          npm pack --pack-destination "$tmp"
          npm install -g --prefix "$tmp/prefix" "$tmp"/*.tgz
          "$tmp/prefix/bin/wheelhouse" --help
          "$tmp/prefix/bin/wheelhouse" --version
          "$tmp/prefix/bin/wh-vault" --help
          "$tmp/prefix/bin/wh-vault" --version

  integration:
    # Runs beside the check job: real git repositories, tmux and herdr servers
    # and child services, then the smoke test against a fresh build.
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # A pinned herdr, checked against its release digest, for the herdr session
      # backend's integration test (it runs its own isolated herdr server).
      - name: Install herdr
        env:
          HERDR_VERSION: 0.7.4
          HERDR_SHA256: bc0fc02d4ba500f9cac2353a43e67fe036785ecca6eb55378e050fac3c103059
        run: |
          mkdir -p "$RUNNER_TEMP/herdr-bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/herdr-bin/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/v${HERDR_VERSION}/herdr-linux-x86_64"
          echo "${HERDR_SHA256}  $RUNNER_TEMP/herdr-bin/herdr" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/herdr-bin/herdr" --version

      - name: Integration tests
        run: npm run test:integration
