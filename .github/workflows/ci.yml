name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Package contents
        # prepack builds the app and the CLI, so this also checks the build.
        run: npm pack --dry-run

      - name: Install the package and start the CLI
        run: |
          tmp="$(mktemp -d)"
          npm pack --pack-destination "$tmp"
          npm install -g --prefix "$tmp/prefix" "$tmp"/*.tgz
          "$tmp/prefix/bin/wheelhouse" --help
          "$tmp/prefix/bin/wheelhouse" --version
          "$tmp/prefix/bin/wh-vault" --help
          "$tmp/prefix/bin/wh-vault" --version
