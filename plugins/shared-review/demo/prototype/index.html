<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Harbour Coffee: checkout</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<header class="top">
			<strong>Harbour Coffee</strong>
			<nav><a href="/">Checkout</a> <a href="/help.html">Help</a></nav>
		</header>
		<main class="checkout">
			<h1>Your order</h1>
			<ul class="lines">
				<li><span>Flat white ×2</span><span>£7.00</span></li>
				<li><span>Almond croissant</span><span>£3.20</span></li>
			</ul>
			<p class="total">Total <strong>£10.20</strong></p>
			<label>Promo code <input name="promo" placeholder="Promo code" /></label>
			<button id="pay" type="button">Pay now</button>
			<p class="small">Collect from the counter in about 5 minutes.</p>
		</main>
	</body>
</html>
