<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Apply the theme before first paint: ?theme=, then the saved choice, then the OS.
			(function () {
				var q = new URLSearchParams(location.search).get('theme');
				var saved = null;
				try {
					saved = localStorage.getItem('wheelhouse-theme');
				} catch (e) {}
				var t = q === 'dark' || q === 'light' ? q : saved;
				var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
				// The left-hand menu folded to its icon rail, as last chosen.
				try {
					if (localStorage.getItem('wheelhouse-nav') === 'rail')
						document.documentElement.dataset.nav = 'rail';
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
