version: 1
extends: ship
checks:
  deploy:
    type: github.deployment
    label: Production deployment
    environment: Production
    ref: merge.commit
stages:
  - id: deployed
    label: Deployed
    after: landed
    reached_when: deploy.success
    failed_when: deploy.failure
    evidence: [ check:deploy ]
    primary_link: deploy.url
    give_up_after: 24h
